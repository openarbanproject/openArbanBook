<html>
<head>
  <title>Grand Method For Cornet</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap');
       
    body { 
      font-family: 'Libre Baskerville', serif; 
      background-color: #fdfaf0; 
      color: #2c2c2c; 
      padding: 40px; 
      max-width: 800px; 
      margin: auto; 
      border: 1px solid #dcdcdc;
      box-shadow: 0 0 20px rgba(0,0,0,0.05);
    }

    .header-box {
      text-align: center;
      border: 4px double #4b2e1e;
      padding: 40px 20px;
      margin-bottom: 40px;
    }

    .cornet-illustration {
      width: 350px;
      filter: sepia(0.6) contrast(1.1) brightness(0.9); 
      margin-bottom: 20px;
    }

    h1 { 
      font-size: 3em;
      margin: 0;
      font-variant: small-caps;
      letter-spacing: 3px;
      color: #1a1a1a;
    }

    .subtitle {
      font-style: italic;
      font-size: 1.1em;
      margin-top: 15px;
      display: block;
      color: #4b2e1e;
    }

    .divider { font-size: 2em; margin: 20px 0; color: #8b4513; text-align: center; }

        ul { list-style: none; padding: 0; }
        li { 
          margin: 12px 0; 
          text-align: center;
          border-bottom: 1px dotted #d3c7b1;
          padding-bottom: 8px;
    }
 
    a { text-decoration: none; color: #4b2e1e; font-weight: bold; font-size: 1.1em; }
    a:hover { color: #8b4513; text-decoration: underline; }
    
      </style>
    </head>
    <body>
      <div class="header-box">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/09/Britannica_Cornet_B%E2%99%AD_with_Strictly_Conical_Bore.png/800px-Britannica_Cornet_B%E2%99%AD_with_Strictly_Conical_Bore.png" class="cornet-illustration">
        <h1>Grand Method For Cornet</h1>
        <span class="subtitle">as it is, from the Open Arban Project</span>
      </div>
      
      <div class="divider">❦</div>
      
      <ul>
    EOF

    for f in *.pdf; do
      if [ -f "" ]; then
        # This removes the .pdf from the link text to keep it looking like a book title
        echo "<li><a href=\"\"></a></li>" >> index.html
      fi
    done

    echo "</ul><div class='divider'>❦</div></body></html>" >> index.html
