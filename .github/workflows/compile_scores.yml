name: Update Master Score Library
on: [push]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up LilyPond
        uses: codello/setup-lilypond@main
        with:
          lilypond-version: 2.24
      - name: Compile ALL scores
        run: |
          mkdir -p master_folder
          # Using -print0 handles filenames with spaces safely
          find . -name "*.ly" -print0 | xargs -0 -I {} lilypond -o master_folder/ "{}"

      - name: Generate Index Page
        run: |
          cd master_folder
          cat <<EOF > index.html
          <html>
          <head>
            <title>Open Arban Book</title>
            <style>
                @import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap');
              
                body { 
                  font-family: 'Libre Baskerville', serif; 
                  line-height: 1.6; 
                  padding: 50px; 
                  max-width: 900px; 
                  margin: auto; 
                  background-color: #fdfaf0; /* Creamy paper color */
                  color: #2c2c2c;
                  border: 1px solid #dcdcdc;
                  box-shadow: inset 0 0 100px rgba(0,0,0,0.05);
                }
              
                h1 { 
                  text-align: center;
                  font-variant: small-caps;
                  font-weight: 700;
                  font-size: 2.5em;
                  border-bottom: 3px double #8b4513; /* Double line for that classic look */
                  padding-bottom: 10px;
                  margin-bottom: 40px;
                }
              
                ul { 
                  list-style: none; 
                  padding: 0; 
                }
              
                li { 
                  margin: 15px 0; 
                  text-align: center;
                }
              
                a { 
                  text-decoration: none; 
                  color: #4b2e1e; /* Deep ink brown */
                  font-size: 1.2em;
                  transition: all 0.3s ease;
                }
              
                a:hover { 
                  color: #8b4513;
                  font-style: italic;
                  text-decoration: underline;
                }
              
                .footer { 
                  font-size: 0.8em; 
                  font-style: italic;
                  text-align: center;
                  margin-top: 60px;
                  color: #777;
                  border-top: 1px solid #eee;
                  padding-top: 20px;
                }
              
                /* Ornate Divider */
                .divider {
                  text-align: center;
                  font-size: 2em;
                  margin: 20px 0;
                  color: #8b4513;
                }
                </style>
          </head>
          <body>
            <h1>🎼 Open Arban Book as it is right now</h1>
            <ul>
          EOF

          # Add each PDF to the list
          for f in *.pdf; do
            if [ -f "$f" ]; then
              echo "<li><a href=\"$f\">📄 ${f%.pdf}</a></li>" >> index.html
            fi
          done

          echo "</ul><div class='footer'>Last updated: $(date)</div></body></html>" >> index.html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: master_folder
          branch: gh-pages
