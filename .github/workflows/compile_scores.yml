name: Update Master Score Library
on: [push]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up LilyPond
        uses: codello/setup-lilypond@main
        with:
          lilypond-version: 2.24

      - name: Compile ALL scores to a central folder
        run: |
          mkdir -p master_folder
          # Find all .ly files and compile them into the master_folder
          find . -name "*.ly" -exec lilypond -o master_folder/ "{}" +

      - name: Generate Index Page
        run: |
          cd master_folder
          echo "<html><head><title>My LilyPond Library</title></head><body>" > index.html
          echo "<h1>My Sheet Music Library</h1><ul>" >> index.html
          # Loop through every PDF and create a link for it
          for f in *.pdf; do
            echo "<li><a href=\"$f\">$f</a></li>" >> index.html
          done
          echo "</ul><p>Last updated: $(date)</p></body></html>" >> index.html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: master_folder
          branch: gh-pages
