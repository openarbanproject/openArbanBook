name: Update Master Score Folder
on: [push]

permissions:
  contents: write  # Allows the script to save PDFs back to GitHub

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up LilyPond
        uses: codello/setup-lilypond@main
        with:
          lilypond-version: 2.24

      - name: Compile ALL scores to a central folder
        run: |
          mkdir -p master_folder
          find . -name "*.ly" -exec lilypond -o master_folder/ "{}" +

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: master_folder # Folder
          branch: gh-pages      # "Website"
