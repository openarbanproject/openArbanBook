name: Update Master Score Library
on: [push]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up LilyPond
        uses: codello/setup-lilypond@main
        with:
          lilypond-version: 2.24

      - name: Install Project Fonts
        run: |
          # Make and define the internal LilyPond font paths
          sudo mkdir $LILYPOND_DATADIR/fonts/otf
          sudo mkfir $LILYPOND_DATADIR/fonts/svg
          LP_OTF="$LILYPOND_DATADIR/fonts/otf"
          LP_SVG="$LILYPOND_DATADIR/fonts/svg"

          # Copy Haydn (Music Fonts)
          sudo cp assets/fonts/haydn/otf/*.otf "$LP_OTF/"
          sudo cp assets/fonts/haydn/svg/*.svg "$LP_SVG/"

          # Install Libre Baskerville (Text Font) to the System path
          sudo mkdir -p /usr/local/share/fonts/librebaskerville
          sudo cp assets/fonts/LibreBaskerville/*.ttf /usr/local/share/fonts/librebaskerville/
          sudo fc-cache -f -v

          # Debug check: See if the files actually arrived
          ls "$LP_OTF" | grep -i haydn

      - name: Prepare Master Folder
        run: |
          mkdir -p master_folder
          # Pull existing PDFs from the gh-pages branch so they aren't lost
          git fetch origin gh-pages
          git --work-tree=master_folder checkout origin/gh-pages -- . || echo "First run, nothing to fetch"

      - name: Compile CHANGED or MISSING scores
        run: |
          mkdir -p master_folder
          # Create a temporary file to store our list of files to build
          touch to_build.txt

          # Get files changed in this push (handling spaces)
          BEFORE_SHA="${{ github.event.before }}"
          if [[ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            # Using -z for null-terminated output from git
            git diff -z --name-only $BEFORE_SHA HEAD | grep -z '\.ly$' | tr '\0' '\n' >> to_build.txt || true
          fi

          # Add any .ly files that don't have a matching .pdf in master_folder
          # -print0 handles spaces perfectly
          find . -name "*.ly" -not -path "./master_folder/*" -print0 | while IFS= read -r -d '' ly_path; do
            filename=$(basename "$ly_path" .ly)
            if [ ! -f "master_folder/$filename.pdf" ]; then
              echo "Missing PDF found: $filename"
              echo "$ly_path" >> to_build.txt
            fi
          done

          # Process the build list
          sort -u to_build.txt -o to_build.txt

          if [ ! -s to_build.txt ]; then
            echo "Everything is up to date."
          else
            echo "Compiling scores..."
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              echo "Processing: $file"
              # The quotes around "$file" are the most important part!
              lilypond -o master_folder/ "$file"
            done < to_build.txt
          fi

      - name: Generate Index Page
        run: |
          TIMESTAMP=$(date +"%B %d, %Y at %H:%M UTC")
          cd master_folder

          # Start the HTML file
          cat << EOF > index.html
          <html>
          <head>
            <title>Grand Method For Cornet</title>
            <style>
              @import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap');
              body { font-family: 'Libre Baskerville', serif; background-color: #fdfaf0; color: #2c2c2c; padding: 40px; max-width: 800px; margin: auto; border: 1px solid #dcdcdc; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
              .header-box { text-align: center; border: 4px double #4b2e1e; padding: 40px 20px; margin-bottom: 40px; }
              .cornet-illustration { width: 350px; margin: 0 auto 20px auto; display: block; mix-blend-mode: multiply; }
              h1 { font-size: 3em; margin: 0; font-variant: small-caps; letter-spacing: 3px; color: #1a1a1a; }
              .subtitle { font-style: italic; font-size: 1.1em; margin-top: 15px; display: block; color: #4b2e1e; }
              .divider { font-size: 2em; margin: 20px 0; color: #8b4513; text-align: center; }
              ul { list-style: none; padding: 0; }
              li { margin: 12px 0; text-align: center; border-bottom: 1px dotted #d3c7b1; padding-bottom: 8px; }
              a { text-decoration: none; color: #4b2e1e; font-weight: bold; font-size: 1.1em; }
              a:hover { color: #8b4513; text-decoration: underline; }
              .footer { text-align: center; font-size: 0.8em; color: #8c7e6d; margin-top: 50px; font-style: italic; }
            </style>
          </head>
          <body>
            <div class="header-box">
              <img src="https://raw.githubusercontent.com/openarbanproject/collaboratorsPack/master/Cornet_1886.png" class="cornet-illustration" class="cornet-illustration">
              <h1>🎼 Grand Method For Cornet 🎺</h1>
              <span class="subtitle">as it is, from the Open Arban Project</span>
            </div>
            <div class="divider">❦</div>
            <ul>
          EOF

          # Updated loop to handle spaces in PDF names
          for f in *.pdf; do
            if [ -f "$f" ]; then
              # URL encode spaces for the HTML link
              encoded_url=$(echo "$f" | sed 's/ /%20/g')
              echo "<li><a href=\"$encoded_url\">${f%.pdf}</a></li>" >> index.html
            fi
          done

          echo "</ul><div class='divider'>❦</div>" >> index.html
          echo "<div class='footer'>Library last updated on $TIMESTAMP</div>" >> index.html
          echo "</body></html>" >> index.html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: master_folder
          branch: gh-pages
