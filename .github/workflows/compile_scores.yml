name: Update Master Score Library
on: [push]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up LilyPond
        uses: codello/setup-lilypond@main
        with:
          lilypond-version: 2.24

      - name: Prepare Master Folder
        run: |
          mkdir -p master_folder
          # Pull existing PDFs from the gh-pages branch so they aren't lost
          git fetch origin gh-pages
          git --work-tree=master_folder checkout origin/gh-pages -- . || echo "First run, nothing to fetch"

    - name: Compile CHANGED scores only
        run: |
          # 1. Check if a parent commit exists
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "Parent commit found. Checking for changes..."
            CHANGED_FILES=$(git diff --name-only HEAD^ HEAD | grep '\.ly$' || true)
          else
            echo "No parent commit found (initial push or shallow clone). Building all files."
            CHANGED_FILES=$(find . -name "*.ly")
          fi

          # 2. Compile based on what we found
          if [ -z "$CHANGED_FILES" ]; then
            echo "No .ly files changed. Skipping LilyPond."
          else
            echo "Compiling the following files:"
            echo "$CHANGED_FILES"

            # Use -n1 to ensure files with spaces or multiple files are handled correctly
            echo "$CHANGED_FILES" | xargs -n1 -I {} lilypond -o master_folder/ "{}"
          fi

      - name: Generate Index Page
        run: |
          TIMESTAMP=$(date +"%B %d, %Y at %H:%M UTC")

          cd master_folder
          cat << EOF > index.html
          <html>
          <head>
            <title>Grand Method For Cornet</title>
            <style>
              @import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap');
              body { font-family: 'Libre Baskerville', serif; background-color: #fdfaf0; color: #2c2c2c; padding: 40px; max-width: 800px; margin: auto; border: 1px solid #dcdcdc; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
              .header-box { text-align: center; border: 4px double #4b2e1e; padding: 40px 20px; margin-bottom: 40px; }
              .cornet-illustration {
                width: 350px;
                margin: 0 auto 20px auto;
                display: block;
                mix-blend-mode: multiply; }
              h1 { font-size: 3em; margin: 0; font-variant: small-caps; letter-spacing: 3px; color: #1a1a1a; }
              .subtitle { font-style: italic; font-size: 1.1em; margin-top: 15px; display: block; color: #4b2e1e; }
              .divider { font-size: 2em; margin: 20px 0; color: #8b4513; text-align: center; }
              ul { list-style: none; padding: 0; }
              li { margin: 12px 0; text-align: center; border-bottom: 1px dotted #d3c7b1; padding-bottom: 8px; }
              a { text-decoration: none; color: #4b2e1e; font-weight: bold; font-size: 1.1em; }
              a:hover { color: #8b4513; text-decoration: underline; }
              /* The New Footer Style */
              .footer {
                text-align: center;
                font-size: 0.8em;
                color: #8c7e6d;
                margin-top: 50px;
                font-style: italic; }
            </style>
          </head>
          <body>
            <div class="header-box">
              <img src="https://raw.githubusercontent.com/openarbanproject/collaboratorsPack/master/Cornet_1886.png" class="cornet-illustration">
              <h1>🎼 Grand Method For Cornet 🎺</h1>
              <span class="subtitle">as it is, from the Open Arban Project</span>
            </div>
            <div class="divider">❦</div>
            <ul>
          EOF

          # Add the PDF links
          for f in *.pdf; do
            if [ -f "$f" ]; then
              echo "<li><a href=\"$f\">${f%.pdf}</a></li>" >> index.html
            fi
          done

          # Add the footer with the timestamp and close tags
          echo "</ul>" >> index.html
          echo "<div class='divider'>❦</div>" >> index.html
          echo "<div class='footer'>Library last updated on $TIMESTAMP</div>" >> index.html
          echo "</body></html>" >> index.html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: master_folder
          branch: gh-pages
